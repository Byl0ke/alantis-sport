name: alantis-sport
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: alantis_sport
      MYSQL_USER: alantis_api
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    # MySQL is deliberately NOT exposed on a public port.
  api:
    build:
      context: ../../backend/mysql
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: alantis_sport
      MYSQL_USER: alantis_api
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      MYSQL_SSL_MODE: disabled # Internal Docker network; never use disabled over the public internet.
      ALANTIS_SQL_KEY_B64: ${ALANTIS_SQL_KEY_B64:?Define AES encryption key}
      ALANTIS_ADMIN_TOKEN: ${ALANTIS_ADMIN_TOKEN:?Define private admin token}
      ALANTIS_SHOPIFY_WEBHOOK_SECRET: ${ALANTIS_SHOPIFY_WEBHOOK_SECRET:?Define webhook secret}
      ALANTIS_ALLOWED_SHOP: psm7b6-qs.myshopify.com
      ALANTIS_ALLOWED_ORIGIN: https://byl0ke.github.io
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ALANTIS_API_HOST: ${ALANTIS_API_HOST:?Set a DNS name that points to the VPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private]
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
networks:
  private:
    driver: bridge